apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lms-app
  template:
    metadata:
      labels:
        app: lms-app
    spec:
      containers:
      - name: lms-container
        image: student-app
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: lms-service
spec:
  type: NodePort
  selector:
    app: lms-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      